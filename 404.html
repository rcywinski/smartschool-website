<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nie znaleziono strony — Smart Language School</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="6; url=/">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    @font-face {
      font-family: 'Archivo'; font-style: normal; font-weight: 400 800; font-display: swap;
      src: url('/assets/fonts/archivo-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20C0;
    }
    @font-face {
      font-family: 'Archivo'; font-style: normal; font-weight: 400 800; font-display: swap;
      src: url('/assets/fonts/archivo-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+2122;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: #f4f4f7; color: #1e1b45; font-family: "Archivo", system-ui, sans-serif; font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    a { color: #2b2570; text-underline-offset: 3px; }
    a:hover { color: #6f8a1f; }
    :focus-visible { outline: 2px solid #b8d94a; outline-offset: 2px; }
    header { background: #fff; border-bottom: 2px solid rgba(30,27,69,0.4); }
    header div, main { max-width: 1200px; margin: 0 auto; padding: 12px 24px; width: 100%; }
    header img { display: block; height: 48px; width: auto; }
    main { flex: 1; padding-top: clamp(48px, 10vw, 120px); padding-bottom: 64px; display: flex; flex-direction: column; gap: 20px; align-items: flex-start; }
    .eyebrow { margin: 0; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: #6f8a1f; }
    h1 { margin: 0; max-width: 18ch; font-size: clamp(34px, 5vw, 60px); font-weight: 800; line-height: 1.04; letter-spacing: -0.02em; text-wrap: balance; }
    p { margin: 0; max-width: 52ch; font-size: 18px; color: #3f3c63; }
    .btn { display: inline-flex; align-items: center; gap: 10px; margin-top: 8px; background: #b8d94a; color: #1e1b45; text-decoration: none; font-weight: 800; font-size: 15px; line-height: 1.2; padding: 14px 20px; min-height: 48px; }
    .btn:hover { background: #a6c93a; color: #1e1b45; }
    .small { font-size: 14px; }
  </style>
</head>
<body>
  <header><div><a href="/"><img src="/assets/logo.jpg" width="858" height="272" alt="Smart Language School — strona główna"></a></div></header>
  <main>
    <p class="eyebrow">Błąd 404</p>
    <h1>Tej strony już u nas nie ma.</h1>
    <p>Adres mógł pochodzić ze starej wersji witryny. Wszystko o kursach, egzaminach i kontakcie znajdziesz teraz na jednej stronie.</p>
    <a class="btn" id="go" href="/">
      Przejdź na stronę główną
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </a>
    <p class="small">Za chwilę przeniesiemy Cię tam automatycznie. Pytania? Zadzwoń: <a href="tel:+48664038297">664 038 297</a>.</p>
  </main>
  <script>
    // Old WordPress / .htm addresses -> matching section of the one-page site
    var p = location.pathname.toLowerCase();
    var target = '/';
    if (/kontakt|zapisz|rekrutacja|praca-u-nas/.test(p)) target = '/#kontakt';
    else if (/oferta|kursy|dla_dzieci|dla_firm|zagran/.test(p)) target = '/#oferta';
    else if (/o_nas|smart-wita|jestesmy-razem/.test(p)) target = '/#o-nas';
    else if (/testy/.test(p)) target = '/#egzaminy';
    document.getElementById('go').href = target;
    setTimeout(function () { location.replace(target); }, 5000);
  </script>
</body>
</html>
